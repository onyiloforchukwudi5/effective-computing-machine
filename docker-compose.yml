x-app: &app
  build: .
  env_file: .env
  depends_on: [db, redis]
  environment: &env
    DATABASE_URL: postgresql://postgres:postgres@db:5432/mailcrm
    REDIS_URL: redis://redis:6379
services:
  web:
    <<: *app
    environment: { <<: *env, SERVICE: web }
    ports: ["3000:3000"]
  worker:
    <<: *app
    environment: { <<: *env, SERVICE: worker }
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mailcrm }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes: { pgdata: {} }
